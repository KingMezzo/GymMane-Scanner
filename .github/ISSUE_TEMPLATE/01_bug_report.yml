name: "🐛 Bug Report"
description: Report a bug or unexpected behavior.
title: "[Bug]: "
type: Bug

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! ❤️

  - type: input
    id: app-version
    attributes:
      label: GymMane Scanner version
      placeholder: "e.g. 2.1.0"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: "e.g. Google Pixel 9, Android 16"

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What happened and what did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can I reproduce the issue?

  - type: textarea
    id: additional-context
    attributes:
      label: Additional information
      description: Add screenshots, barcodes, logs or anything helpful. Please remove sensitive information.
